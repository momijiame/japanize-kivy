name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:

  deploy:

    name: Publish to PyPI

    runs-on: ubuntu-latest

    # Gated by a wait timer and restricted to v* tags; also the environment
    # PyPI's trusted publisher is registered against.
    environment: pypi

    permissions:
      # Mint the OIDC token that PyPI exchanges for a short-lived upload
      # token. Without this the publish step has no credential at all.
      id-token: write
      contents: read

    steps:

      # See: https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # setuptools-scm derives the version from the tags, so fetch them all
          fetch-depth: 0

      # See: https://github.com/astral-sh/setup-uv
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Build package
        run: uv build

      # See: https://github.com/pypa/gh-action-pypi-publish
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # No user/password: the action detects the OIDC token and exchanges
          # it with PyPI itself. PEP 740 attestations are on by default and
          # only work over trusted publishing.
          print-hash: true
